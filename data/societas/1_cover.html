<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Evolution of Meetings: From Text to AI-Powered Productivity</title>
    <link href="/fonts/Arvo/index.css" rel="stylesheet">
    <link href="/fonts/Inter/index.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-background: #1a1a2e;
            --color-primary: #e8e8f0;
            --color-secondary: #b8b8d0;
            --color-accent: #f0f0f8;
            --heading-font: 'Arvo', serif;
            --body-font: 'Inter', sans-serif;
            --heading-size: 2.6rem;
            --body-size: 1.0rem;
        }

        .slide-container {
            height: 100vh;
            width: 100%;
            background: var(--color-background);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .cover-slide {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            text-align: center;
            position: relative;
        }

        .cover-icon {
            font-size: 3em;
            color: var(--color-primary);
            margin-bottom: 2rem;
        }

        .cover-title {
            font-family: var(--heading-font);
            font-size: calc(var(--heading-size) * 1.2);
            font-weight: 700;
            color: var(--color-accent);
            text-shadow: 0px 1px 2px rgba(0, 0, 0, 0.4);
            margin-bottom: 1.5rem;
            line-height: 1.2;
            max-width: 90%;
        }

        .cover-subtitle {
            font-family: var(--body-font);
            font-size: calc(var(--body-size) * 1.4);
            font-weight: 400;
            color: var(--color-secondary);
            margin-bottom: 3rem;
            line-height: 1.4;
            max-width: 80%;
        }

        .cover-footer {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--body-font);
            font-size: var(--body-size);
            color: var(--color-secondary);
            text-align: center;
        }

        .footer-author {
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .footer-date {
            font-size: 0.9em;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="cover-slide">
            <i class="fas fa-comments cover-icon"></i>
            
            <h1 class="cover-title">
                The Evolution of Meetings: From Text to AI-Powered Productivity
            </h1>
            
            <h2 class="cover-subtitle">
                Transforming spoken intent into immediate, actionable outputs through intelligent automation
            </h2>
            
            <div class="cover-footer">
                <div class="footer-author">Meeting Productivity Transformation</div>
                <div class="footer-date">December 24, 2025</div>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</body>
</html>
